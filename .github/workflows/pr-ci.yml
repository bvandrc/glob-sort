name: PR CI

# The jobs that only run on a pull request.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line-count:
    name: Line Count
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required: diffs the merge base against the head, so both have to be in the clone.

      # Installs cloc, resolves the merge base, and writes the job summary.
      - name: Count the changed lines
        uses: bvandrc/pr-diff-line-count@v1
        with:
          comment: false
