name: PR Reports

# The jobs that report on a pull request, in the run's job summary rather than
# a comment: a bot comment notifies on every pull request, and the summary is
# one click away from the check.
#
# Note: Kept out of ci.yml because GitHub creates a check run for
# every job in a workflow before it evaluates `if:`, so a single file
# serving both push and pull_request reports the other event's jobs as
# skipped checks on every PR.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line-count:
    name: Line Count
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required: diffs the merge base against the head, so both have to be in the clone.

      # Installs cloc, resolves the merge base, and writes the job summary.
      - name: Count the changed lines
        uses: bvandrc/pr-diff-line-count@v1
        with:
          comment: false
